[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-ai-literature-hub"
version = "0.1.0"
description = "Unified arXiv extraction entrance and local research-wiki server for the embodied-learning knowledge base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
] # HTML path is stdlib-only; PDF fallback needs the optional extra below

[project.optional-dependencies]
pdf = ["pypdf"] # only needed for --force-pdf / PDF fallback extraction
s3 = ["boto3"] # anonymous S3 download of arXiv TeX source tarballs (download_arxiv_source.py)
tex = ["pypandoc"] # TeX -> Markdown parsing (extract_arxiv_tex.py); pandoc binary required separately
sources = ["boto3", "pypandoc"] # convenience: full TeX-source recovery chain

[project.scripts]
extract_arxiv = "extract_arxiv_content:main"
serve_research_wiki = "wiki_scripts.serve_research_wiki:main"

[tool.setuptools]
# Two module roots in one distribution: the hub's flat extractor modules, and
# the top-level wiki scripts as the `wiki_scripts` package (repo scripts/,
# including the shared `lib/` helpers). The repo's wiki/ frontend shell is
# mapped in as `wiki_scripts.wiki_assets` at build time — no copied tree — so a
# non-editable install can bootstrap <kb-root>/wiki for a new user. Wiki data
# (snapshots under wiki/data) is NOT packaged: it is built next to the
# knowledge base at serve time.
package-dir = { "" = "skills/embodied-ai-literature-hub/scripts", "wiki_scripts" = "scripts", "wiki_scripts.wiki_assets" = "wiki" }
packages = ["wiki_scripts", "wiki_scripts.lib", "wiki_scripts.wiki_assets"]
include-package-data = false

[tool.setuptools.package-data]
# The frontend shell: index.html + assets/* only. wiki/data (built snapshots)
# holds JSON and is deliberately not matched.
"wiki_scripts.wiki_assets" = ["index.html", "assets/*.css", "assets/*.js", "assets/*.svg"]
py-modules = [
    "extract_arxiv_content",
    "extract_arxiv_html",
    "extract_arxiv_pdf",
    "extract_arxiv_tex",
    "download_arxiv_source",
]
