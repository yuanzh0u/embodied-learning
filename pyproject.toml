[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-learning"
version = "0.1.0"
description = "Unified arXiv extraction entrance and local research-wiki server for the embodied-learning knowledge base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
] # HTML path is stdlib-only; PDF fallback needs the optional extra below

[project.optional-dependencies]
pdf = ["pypdf"] # only needed for --force-pdf / PDF fallback extraction
s3 = ["boto3"] # anonymous S3 download of arXiv TeX source tarballs (download_arxiv_source.py)
tex = ["pypandoc"] # TeX -> Markdown parsing (extract_arxiv_tex.py); pandoc binary required separately
sources = ["boto3", "pypandoc"] # convenience: full TeX-source recovery chain

[project.scripts]
extract_arxiv = "hub_scripts.extract_arxiv_content:main"
serve_research_wiki = "wiki_scripts.serve_research_wiki:main"
run_review_pipeline = "wiki_scripts.run_review_pipeline:main"
launch_review = "wiki_scripts.launch_review:main"
quick_read_paper = "wiki_scripts.quick_read_paper:main"
paper_slide_deck = "wiki_scripts.paper_slide_deck:main"
run_slide_deck = "wiki_scripts.run_slide_deck:main"

[tool.setuptools]
# Three module roots in one distribution: the arXiv data-processing
# `embodied_learning` package (repo embodied_learning/, with
# search/fetch/parse/knowledge layers), the hub skill's CLI entries as
# `hub_scripts` (skills/embodied-ai-literature-hub/scripts), and the top-level
# wiki scripts as the `wiki_scripts` package (repo scripts/, including the
# shared `lib/` helpers). `embodied_learning` is the distribution's own name,
# so the in-repo and installed import names match for everything. The repo's
# wiki/ frontend shell is mapped in as `wiki_scripts.wiki_assets` at build
# time — no copied tree — so a non-editable install can bootstrap
# <kb-root>/wiki for a new user. Wiki data (snapshots under wiki/data) is NOT
# packaged: it is built next to the knowledge base at serve time.
# The skill entry scripts are packaged as `hub_scripts` so the `extract_arxiv`
# console script (and the src-side subprocess fallback) resolve after install.
# The full skills/ tree ships as `wiki_scripts.skills` package data (SKILL.md,
# references, agents, scripts — tests excluded by the globs) so an installed
# layout has a skills root for the workflow agents to read and for the driver
# to spawn from; the hub scripts it duplicates under skills/…/scripts are the
# same files as the `hub_scripts` package (file-path spawn consistency beats
# byte savings). With that mapping, the installed `wiki_scripts` directory is
# layout-complete: it IS the scripts root and contains skills/ (see
# scripts/lib/layout.py).
packages = [
    "embodied_learning",
    "embodied_learning.search",
    "embodied_learning.fetch",
    "embodied_learning.parse",
    "embodied_learning.knowledge",
    "embodied_learning.harness",
    "hub_scripts",
    "wiki_scripts", "wiki_scripts.lib", "wiki_scripts.wiki_assets",
    "wiki_scripts.skills",
]
include-package-data = false

[tool.setuptools.package-dir]
hub_scripts = "skills/embodied-ai-literature-hub/scripts"
wiki_scripts = "scripts"
"wiki_scripts.wiki_assets" = "wiki"
"wiki_scripts.skills" = "skills"

[tool.setuptools.package-data]
# The frontend shell: index.html + assets/* only. wiki/data (built snapshots)
# holds JSON and is deliberately not matched.
"wiki_scripts.wiki_assets" = ["index.html", "assets/*.css", "assets/*.js", "assets/*.svg"]
# The three skill trees: SKILL.md, references, agent manifests and scripts —
# tests/ and __pycache__ never match these globs.
"wiki_scripts.skills" = [
    "*/SKILL.md", "*/references/*.md", "*/agents/*.yaml", "*/scripts/*.py",
    "*/assets/*.css", "*/assets/reveal/*",
]
