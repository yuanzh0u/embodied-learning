name: Deploy Research Wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'knowledge/**'
      - 'evidence/**'
      - 'scripts/build_research_wiki.py'
      - 'scripts/visualize_kb_index.py'
      - 'scripts/lib/**'
      - '.github/workflows/deploy-research-wiki.yml'
  # Preview deployments: build + deploy a PR to a temporary Pages preview so
  # reviewers can see the rendered Wiki before merging, instead of waiting for
  # the production push to main. `actions/deploy-pages` detects the pull_request
  # event and targets a preview environment; the URL is posted on the PR.
  pull_request:
    paths:
      - 'wiki/**'
      - 'knowledge/**'
      - 'evidence/**'
      - 'scripts/build_research_wiki.py'
      - 'scripts/visualize_kb_index.py'
      - 'scripts/lib/**'
      - '.github/workflows/deploy-research-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref group: previews (refs/pull/N/merge) must not cancel production
  # (refs/heads/main) or each other.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Build research wiki snapshot
        # The snapshot is generated at deploy time from knowledge/ + evidence/;
        # wiki/data is gitignored, so nothing is committed. The build runs
        # validate_snapshot internally before activating the snapshot.
        run: python3 scripts/build_research_wiki.py --output wiki/data

      - name: Assemble Wiki and knowledge map
        run: |
          mkdir -p _site/knowledge-map
          cp -R wiki/. _site/
          python3 scripts/visualize_kb_index.py \
            --no-open \
            --output _site/knowledge-map/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: ${{ github.event_name == 'pull_request' }}
