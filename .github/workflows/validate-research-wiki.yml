name: Validate Research Wiki

on:
  pull_request:
    paths:
      - 'wiki/**'
      - 'knowledge/**'
      - 'evidence/**'
      - 'scripts/wiki.py'
      - 'embodied_learning/**'
      - 'scripts/run.py'
      - 'tests/test_build_research_wiki.py'
      - 'tests/test_build_research_site.py'
      - 'tests/test_markdown_semantics.py'
      - 'tests/test_review_runs.py'
      - 'tests/test_serve_research_wiki.py'
      - 'tests/test_wiki_chat.py'
      - '.github/workflows/deploy-research-wiki.yml'
      - '.github/workflows/validate-research-wiki.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build and validate content snapshot
        # No committed snapshot exists (wiki/data is gitignored); a successful
        # build runs validate_snapshot internally, so it is itself the check.
        run: python3 scripts/wiki.py build-wiki --output /tmp/wiki-check
      - name: Build noindex preview and knowledge map
        run: |
          python3 scripts/wiki.py build-site \
            --snapshot-root /tmp/wiki-check \
            --wiki-root wiki \
            --output /tmp/site-check \
            --base-url https://yuanzh0u.github.io/embodied-learning \
            --preview
          mkdir -p /tmp/site-check/knowledge-map
          python3 scripts/wiki.py build-knowledge-map --no-open --output /tmp/site-check/knowledge-map/index.html
          python3 scripts/wiki.py build-site \
            --output /tmp/site-check \
            --base-url https://yuanzh0u.github.io/embodied-learning \
            --preview \
            --check-only
      - name: Check Python syntax
        run: python3 -m py_compile scripts/run.py scripts/wiki.py skills/embodied-ai-literature-hub/scripts/search.py skills/embodied-ai-literature-hub/scripts/fetch.py skills/embodied-ai-paper-reader/scripts/read.py skills/embodied-ai-review-writer/scripts/write.py
      - name: Run complete regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Validate routed reviews and knowledge links
        run: |
          python3 scripts/run.py validate-reviews --root .
          python3 scripts/wiki.py check-kb-links --root .
