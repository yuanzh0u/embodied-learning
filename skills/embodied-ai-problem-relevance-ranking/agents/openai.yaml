interface:
  display_name: "Embodied AI Problem-Relevance Ranking"
  short_description: "Rank papers by fit to a review's open research questions via citation expansion + BM25 retrieval over abstract/intro/related-work"
  default_prompt: "Use $embodied-ai-problem-relevance-ranking to find the papers most relevant to a review's open questions: multi-round citation expansion from the review's seeds, then BM25 retrieval over each candidate's abstract/intro/related-work to a ~50 shortlist with relevance explanations. Read the 50 down to a 20-paper relevance ranking, then hand 10 to $embodied-ai-paper-reader for full-text reading."
